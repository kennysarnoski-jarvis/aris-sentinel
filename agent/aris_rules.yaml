# Aris Sentinel — Falco capture rule.
#
# One permissive rule that emits EVERY process exec as JSON. Aris does its OWN
# scoring on the decoded payload, so we don't rely on Falco's threat rules — we
# just want the raw exec stream. The agent (sentinel-agent.mjs) consumes these
# events, scores each for the agentic-narration signature, and kills on a block.
#
# NB: loaded with `-r`, which OVERRIDES Falco's default rules_files — so the
# condition must be SELF-CONTAINED (no `spawned_process` macro, which lives in the
# default falco_rules.yaml and would be undefined here).
#
# %proc.cwd is REQUIRED: the agent resolves a relative script path (`python3 job.py`)
# against the process's own cwd, never its own. Existing installs must re-run
# install.sh (it re-copies this file) to pick that up.
#
# %proc.aname[2..4] and %user.loginuid feed the --behavior service rule: the names of the
# processes above the exec (a web server's child is told apart from a login's) and whether
# anybody logged in to start it. An install with the older rule still works; it sees a
# service that systemd starts and not one inside a container, until install.sh is re-run.
- rule: aris_exec_capture
  desc: Emit every process exec for Aris Sentinel scoring
  condition: (evt.type in (execve, execveat) and evt.dir=<)
  output: "aris_exec pid=%proc.pid ppid=%proc.ppid sid=%proc.sid user=%user.name auid=%user.loginuid exe=%proc.exe pname=%proc.pname gpname=%proc.aname[2] ggpname=%proc.aname[3] gggpname=%proc.aname[4] cwd=%proc.cwd cmdline=%proc.cmdline"
  priority: INFORMATIONAL
  tags: [aris]
